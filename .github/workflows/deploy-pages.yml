name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run docs:build

      # アプリを /taikutsu/、ドキュメントを /taikutsu/docs/ として1つのサイトにまとめる。
      # 404.html はアプリのURLを直接開いて再読み込みしたときの受け皿。
      - name: Assemble combined Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -r dist/. site/
          cp -r docs/.vitepress/dist site/docs
          cp site/index.html site/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
