    <!-- Dela Gothic One: the intro's main headline only (see HomePage.css's
         .introproto-title h1) — Google Fonts ships this family in a single
         weight (400), so this requests nothing extra. display=swap shows
         the fallback sans-serif immediately and swaps in-place once the
         webfont lands, so the headline is never invisible while it loads
         or if the request fails. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
